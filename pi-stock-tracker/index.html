<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Stock Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#f5f6f8; --card:#ffffff; --text:#14171c; --muted:#68707d; --line:#e6e8ec; --hover:#f0f2f5;
    --up:#0f8a4b; --down:#d4343a; --up-bg:#e3f5ea; --down-bg:#fbe7e8; --accent:#2f6fec; --accent-text:#fff;
    --shadow:0 1px 2px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0d0f13; --card:#161a20; --text:#e7e9ed; --muted:#959cab; --line:#262b33; --hover:#1d2229;
      --up:#3ccf7e; --down:#ff6b6f; --up-bg:#123323; --down-bg:#3a1719; --accent:#5b8ff9; --shadow:none;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0d0f13; --card:#161a20; --text:#e7e9ed; --muted:#959cab; --line:#262b33; --hover:#1d2229;
    --up:#3ccf7e; --down:#ff6b6f; --up-bg:#123323; --down-bg:#3a1719; --accent:#5b8ff9; --shadow:none;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  button, select, input { font:inherit; color:inherit; }

  /* Header */
  header { position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); }
  .bar { max-width:1180px; margin:0 auto; padding:10px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .logo { font-weight:700; font-size:17px; white-space:nowrap; color:var(--text); }
  nav { display:flex; gap:4px; }
  nav a { padding:6px 12px; border-radius:8px; color:var(--muted); font-weight:500; }
  nav a.on { background:var(--hover); color:var(--text); }
  #searchWrap { position:relative; flex:1; min-width:220px; }
  #search { width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line); border-radius:10px; background:var(--bg); outline:none; }
  #search:focus { border-color:var(--accent); }
  #searchWrap::before { content:"⌕"; position:absolute; left:11px; top:6px; font-size:18px; color:var(--muted); }
  #results { position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--card); border:1px solid var(--line);
             border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.18); max-height:420px; overflow:auto; display:none; }
  .res { display:flex; justify-content:space-between; gap:12px; padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--line); }
  .res:last-child { border-bottom:0; }
  .res:hover, .res.sel { background:var(--hover); }
  .res .nm { color:var(--muted); font-size:13px; }
  .iconBtn { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:18px; line-height:1.3; }

  main { max-width:1180px; margin:0 auto; padding:16px; }
  .status { color:var(--muted); font-size:12px; margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card h2 { font-size:15px; margin:0; }
  .cardHead { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .muted { color:var(--muted); }
  .small { font-size:12px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .pill { display:inline-block; min-width:64px; text-align:right; padding:2px 8px; border-radius:6px; font-weight:600; font-variant-numeric:tabular-nums; }
  .pill.up { background:var(--up-bg); } .pill.down { background:var(--down-bg); }
  .grid { display:grid; gap:16px; }
  .g4 { grid-template-columns:repeat(4, 1fr); }
  .g2 { grid-template-columns:1fr 1fr; }
  .g3 { grid-template-columns:2fr 1fr; }
  @media (max-width:900px) { .g4 { grid-template-columns:1fr 1fr; } .g3 { grid-template-columns:1fr; } }
  @media (max-width:640px) { .g2 { grid-template-columns:1fr; } nav a { padding:6px 8px; } }

  /* Index cards */
  .idx { margin:0; cursor:pointer; }
  .idx .nm { color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .idx .px { font-size:20px; font-weight:700; margin:2px 0; font-variant-numeric:tabular-nums; }
  .idx svg { width:100%; height:40px; display:block; margin-top:6px; }

  /* Segmented buttons */
  .seg { display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:2px; flex-wrap:wrap; }
  .seg button { border:0; background:none; padding:4px 10px; border-radius:7px; cursor:pointer; color:var(--muted); font-weight:500; }
  .seg button.on { background:var(--card); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.12); }
  select, .filters input { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 8px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  /* Lists */
  .list .item { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .list .item:last-child { border-bottom:0; }
  .list .item:hover { background:var(--hover); }
  .list .sym { font-weight:700; width:64px; }
  .list .nm { flex:1; min-width:0; color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:13px; }
  .grid > * { min-width:0; }
  @media (max-width:640px) { .list .sym { width:auto; min-width:52px; } .list .nm { font-size:12px; } .sector { grid-template-columns:120px 1fr 56px; } }
  .list .px { font-variant-numeric:tabular-nums; }
  .colTitle { font-weight:600; margin:0 0 4px; font-size:13px; }

  /* Sector bars */
  .sector { display:grid; grid-template-columns:150px 1fr 60px; align-items:center; gap:8px; padding:5px 0; font-size:13px; cursor:pointer; }
  .sector:hover .label { color:var(--accent); }
  .track { position:relative; height:10px; background:var(--bg); border-radius:5px; }
  .track span { position:absolute; top:0; bottom:0; border-radius:5px; }
  .track::after { content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--line); }

  /* Tables */
  .tableWrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { font-size:12px; color:var(--muted); font-weight:600; cursor:pointer; user-select:none; position:sticky; top:0; background:var(--card); }
  th.sorted { color:var(--text); }
  tbody tr { cursor:pointer; } tbody tr:hover { background:var(--hover); }
  td .nm { color:var(--muted); font-size:12px; max-width:220px; overflow:hidden; text-overflow:ellipsis; display:block; }
  .star { cursor:pointer; color:var(--muted); font-size:16px; padding:0 4px; background:none; border:0; }
  .star.on { color:#f5b301; }
  .pager { display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:8px; flex-wrap:wrap; }
  .pager button { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .filters input { flex:1; min-width:160px; }

  /* Stock page */
  .back { display:inline-block; margin-bottom:10px; color:var(--muted); cursor:pointer; }
  .stockHead { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .stockHead h1 { font-size:22px; margin:0; }
  .bigPrice { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; }
  .chartBox { position:relative; height:320px; margin-top:12px; }
  .perf { display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; }
  @media (max-width:640px) { .perf { grid-template-columns:repeat(3, 1fr); } }
  .perf div { background:var(--bg); border-radius:10px; padding:8px; text-align:center; }
  .perf b { display:block; font-size:15px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:0 24px; }
  .stats div { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); gap:12px; }
  .stats div span:last-child { text-align:right; font-weight:600; }
  @media (max-width:640px) { .stats { grid-template-columns:1fr; } }
  .about p { margin:8px 0 0; color:var(--muted); }
  .empty { padding:24px; text-align:center; color:var(--muted); }
  .skeleton { color:var(--muted); padding:12px 0; }
  .badge { font-size:12px; font-weight:600; padding:3px 8px; border-radius:999px; background:var(--hover); color:var(--muted); white-space:nowrap; }
  .badge.on { background:var(--up-bg); color:var(--up); }
  .badge.on::first-letter { animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .flash-up { animation:flashUp 1s ease-out; } .flash-down { animation:flashDown 1s ease-out; }
  @keyframes flashUp { from { background:var(--up-bg); color:var(--up); } }
  @keyframes flashDown { from { background:var(--down-bg); color:var(--down); } }
  .liveDot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--up); margin-left:6px; vertical-align:middle; animation:pulse 1.6s infinite; }
  footer { max-width:1180px; margin:0 auto; padding:8px 16px 32px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#market">📈 Pi Stock Tracker</a>
    <nav>
      <a href="#market" data-v="market">Market</a>
      <a href="#screener" data-v="screener">Screener</a>
      <a href="#favorites" data-v="favorites">★ Favorites</a>
    </nav>
    <div id="searchWrap">
      <input id="search" placeholder="Search stocks, tickers or CEOs…" autocomplete="off">
      <div id="results"></div>
    </div>
    <span class="badge" id="liveBadge" title="">● …</span>
    <button class="iconBtn" id="themeBtn" title="Toggle light/dark">◐</button>
  </div>
</header>

<main>
  <p class="status" id="status">Connecting…</p>
  <div id="view"></div>
</main>
<footer>Prices from Nasdaq and Yahoo Finance, may be delayed. Past performance only — not investment advice.</footer>

<script>
// ---------- utilities ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async path => { const r = await fetch(path); if (!r.ok) throw new Error(r.status); return r.json(); };
const money = n => n == null ? "–" : "$" + n.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: n < 1 ? 4 : 2});
const big = n => n == null || !n ? "–" : n >= 1e12 ? (n/1e12).toFixed(2) + "T" : n >= 1e9 ? (n/1e9).toFixed(2) + "B" : n >= 1e6 ? (n/1e6).toFixed(1) + "M" : n >= 1e3 ? (n/1e3).toFixed(1) + "K" : String(Math.round(n));
const cls = n => n == null ? "muted" : n >= 0 ? "up" : "down";
const pctTxt = n => n == null ? "–" : (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
const pill = n => `<span class="pill ${cls(n)}">${pctTxt(n)}</span>`;
const pctSpan = n => `<span class="${cls(n)}">${pctTxt(n)}</span>`;
const livePill = r => `<span class="pill ${cls(r["1d"])}" data-lc="${esc(r.symbol)}" data-base="pill">${pctTxt(r["1d"])}</span>`;
const liveSpan = r => `<span class="${cls(r["1d"])}" data-lc="${esc(r.symbol)}" data-base="">${pctTxt(r["1d"])}</span>`;
const todayTxt = (n, c) => c == null ? "" : `${n != null ? (n >= 0 ? "+" : "") + n.toFixed(2) + " " : ""}(${pctTxt(c)}) today`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const PERIODS = [["1d","1D"],["1w","1W"],["1m","1M"],["6m","6M"],["ytd","YTD"],["1y","1Y"]];
const SIZES = [["0","All sizes"],["300000000","Small+ (>$300M)"],["2000000000","Mid+ (>$2B)"],["10000000000","Large (>$10B)"],["200000000000","Mega (>$200B)"]];
const seg = (items, on, attr) => `<div class="seg">${items.map(([k, l]) => `<button data-${attr}="${k}" class="${k === on ? "on" : ""}">${l}</button>`).join("")}</div>`;
const options = (items, on) => items.map(([k, l]) => `<option value="${esc(k)}" ${k === on ? "selected" : ""}>${esc(l)}</option>`).join("");
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

let favs = store.get("favs", []);
const isFav = s => favs.includes(s);
function toggleFav(s) {
  favs = isFav(s) ? favs.filter(x => x !== s) : [...favs, s];
  store.set("favs", favs);
  document.querySelectorAll(`.star[data-fav="${CSS.escape(s)}"]`).forEach(b => { b.classList.toggle("on", isFav(s)); b.textContent = isFav(s) ? "★" : "☆"; });
}
const starBtn = s => `<button class="star ${isFav(s) ? "on" : ""}" data-fav="${esc(s)}" title="Add to favorites">${isFav(s) ? "★" : "☆"}</button>`;

// Theme
const savedTheme = store.get("theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  store.set("theme", document.documentElement.dataset.theme);
  route();
};

// Global clicks: stars and stock links
document.addEventListener("click", e => {
  const star = e.target.closest("[data-fav]");
  if (star) { e.stopPropagation(); toggleFav(star.dataset.fav); if (location.hash === "#favorites") route(); return; }
  const go = e.target.closest("[data-go]");
  if (go) location.hash = "#stock/" + encodeURIComponent(go.dataset.go);
  if (!e.target.closest("#searchWrap")) $("#results").style.display = "none";
});

// ---------- status ----------
async function loadStatus() {
  try {
    const s = await api("/api/status");
    const crawl = s.crawl_total ? (s.crawl_done >= s.crawl_total ? "price history ready" : `loading price history ${s.crawl_done.toLocaleString()}/${s.crawl_total.toLocaleString()}`) : "";
    $("#status").textContent = s.stocks
      ? `${s.stocks.toLocaleString()} US stocks · prices updated ${s.updated || "…"} · ${crawl}` + (s.profiles_ok ? "" : " · company profiles unavailable")
      : "Downloading all US stocks… this takes a few seconds.";
    return s;
  } catch { $("#status").textContent = "Can't reach the Pi — is server.py running?"; }
}

// ---------- search ----------
const box = $("#search"), results = $("#results");
let searchTimer, searchSel = -1;
box.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = box.value.trim();
    if (!q) { results.style.display = "none"; return; }
    const list = await api("/api/search?q=" + encodeURIComponent(q));
    searchSel = list.length ? 0 : -1;
    results.innerHTML = list.length ? list.map((s, i) => `
      <div class="res ${i === 0 ? "sel" : ""}" data-go="${esc(s.symbol)}">
        <div><b>${esc(s.symbol)}</b> <span class="nm">${esc(s.name)}</span>
          ${s.ceo ? `<div class="nm">CEO: ${esc(s.ceo)}</div>` : ""}</div>
        <div style="text-align:right">${money(s.price)}<div>${pctSpan(s["1d"])}</div></div>
      </div>`).join("") : '<div class="empty">No matches</div>';
    results.style.display = "block";
  }, 180);
});
box.addEventListener("keydown", e => {
  const items = [...results.querySelectorAll(".res")];
  if (!items.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    searchSel = (searchSel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((el, i) => el.classList.toggle("sel", i === searchSel));
  } else if (e.key === "Enter" && searchSel >= 0) {
    location.hash = "#stock/" + encodeURIComponent(items[searchSel].dataset.go);
    results.style.display = "none"; box.value = ""; box.blur();
  } else if (e.key === "Escape") { results.style.display = "none"; }
});
results.addEventListener("click", () => { results.style.display = "none"; box.value = ""; box.blur(); });

// ---------- shared stock table ----------
const COLS = [["symbol","Stock"],["price","Price"],["1d","1D"],["1w","1W"],["1m","1M"],["6m","6M"],["ytd","YTD"],["1y","1Y"],["cap","Mkt cap"],["volume","Volume"],["sector","Sector"]];
function tableHTML(rows, sort, order) {
  if (!rows.length) return '<div class="empty">No stocks match.</div>';
  return `<div class="tableWrap"><table><thead><tr><th style="width:24px"></th>${COLS.map(([k, l]) =>
    `<th data-sort="${k}" class="${k === sort ? "sorted" : ""}">${l}${k === sort ? (order === "desc" ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr data-go="${esc(r.symbol)}">
      <td>${starBtn(r.symbol)}</td>
      <td><b>${esc(r.symbol)}</b><span class="nm">${esc(r.name)}</span></td>
      <td data-lp="${esc(r.symbol)}">${money(r.price)}</td>
      <td>${liveSpan(r)}</td>${["1w","1m","6m","ytd","1y"].map(k => `<td>${pctSpan(r[k])}</td>`).join("")}
      <td>${big(r.cap)}</td><td>${big(r.volume)}</td><td class="muted">${esc(r.sector)}</td></tr>`).join("")}</tbody></table></div>`;
}

// ---------- views ----------
let chart, refreshTimer;
const view = $("#view");
const marketState = store.get("market", {period: "1d", mincap: "2000000000"});
const screenState = store.get("screener", {q: "", sector: "", mincap: "0", sort: "cap", order: "desc", offset: 0});

function sparkSVG(values, color) {
  if (!values || values.length < 2) return "";
  const min = Math.min(...values), max = Math.max(...values), w = 200, h = 40;
  const pts = values.map((v, i) => `${(i / (values.length - 1) * w).toFixed(1)},${(h - 2 - (v - min) / ((max - min) || 1) * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}" vector-effect="non-scaling-stroke"/></svg>`;
}

const listHTML = (rows, key) => rows.length ? rows.map(r => `
  <div class="item" data-go="${esc(r.symbol)}"><span class="sym">${esc(r.symbol)}</span><span class="nm">${esc(r.name)}</span>
  <span class="px" data-lp="${esc(r.symbol)}">${money(r.price)}</span>${key === "1d" ? livePill(r) : pill(r[key])}</div>`).join("") : '<div class="skeleton">Waiting for data… (week/month/year numbers fill in as the Pi downloads price history)</div>';

async function renderMarket() {
  view.innerHTML = `
    <div class="grid g4" id="indices"><div class="card idx skeleton">Loading indexes…</div></div>
    <div class="card" style="margin-top:16px">
      <div class="cardHead"><h2>Top &amp; worst performers</h2>
        <div class="controls">${seg(PERIODS, marketState.period, "period")}
          <select id="mSize">${options(SIZES, marketState.mincap)}</select></div></div>
      <div class="grid g2">
        <div><p class="colTitle up">▲ Top gainers</p><div class="list" id="gainers"><div class="skeleton">Loading…</div></div></div>
        <div><p class="colTitle down">▼ Top losers</p><div class="list" id="losers"><div class="skeleton">Loading…</div></div></div>
      </div>
    </div>
    <div class="grid g3">
      <div class="card"><div class="cardHead"><h2>Most active today</h2><span class="muted small">by shares traded</span></div><div class="list" id="active"></div></div>
      <div class="card"><div class="cardHead"><h2>Sectors today</h2><span class="muted small">weighted by size</span></div><div id="sectors"></div></div>
    </div>`;
  view.querySelectorAll("[data-period]").forEach(b => b.onclick = () => {
    marketState.period = b.dataset.period; store.set("market", marketState);
    view.querySelectorAll("[data-period]").forEach(x => x.classList.toggle("on", x === b));
    fillMarket();
  });
  $("#mSize").onchange = e => { marketState.mincap = e.target.value; store.set("market", marketState); fillMarket(); };
  fillMarket();
}

async function fillMarket() {
  const p = marketState.period, cap = marketState.mincap;
  const q = `/api/screener?period=${p}&sort=${p}&mincap=${cap}&limit=10`;
  const [idx, gain, lose, active, sectors] = await Promise.allSettled([
    api("/api/market"), api(q + "&order=desc"), api(q + "&order=asc"),
    api("/api/screener?sort=volume&order=desc&mincap=300000000&limit=10"), api("/api/sectors")]);
  if (!$("#indices")) return;  // user navigated away
  const v = r => r.status === "fulfilled" ? r.value : null;
  drawIndices(v(idx));
  const nonNull = rows => (rows || []).filter(r => r[p] != null);
  $("#gainers").innerHTML = listHTML(nonNull(v(gain)?.rows).filter(r => r[p] >= 0), p);
  $("#losers").innerHTML = listHTML(nonNull(v(lose)?.rows).filter(r => r[p] < 0), p);
  $("#active").innerHTML = listHTML(v(active)?.rows || [], "1d");
  const secs = v(sectors) || [];
  const maxAbs = Math.max(1, ...secs.map(s => Math.abs(s.change)));
  $("#sectors").innerHTML = secs.map(s => {
    const w = Math.abs(s.change) / maxAbs * 50;
    return `<div class="sector" data-sector="${esc(s.sector)}"><span class="label">${esc(s.sector)}</span>
      <div class="track"><span style="background:${cssVar(s.change >= 0 ? "--up" : "--down")};${s.change >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`}"></span></div>
      ${pctSpan(s.change)}</div>`;
  }).join("") || '<div class="skeleton">Loading…</div>';
  view.querySelectorAll("[data-sector]").forEach(el => el.onclick = () => {
    Object.assign(screenState, {sector: el.dataset.sector, sort: "1d", order: "desc", offset: 0});
    store.set("screener", screenState); location.hash = "#screener";
  });
}

let lastIdx = {};
function drawIndices(list) {
  if (!$("#indices")) return;
  $("#indices").innerHTML = (list || []).map(i => {
    const before = lastIdx[i.symbol];
    lastIdx[i.symbol] = i.price;
    const dir = before == null || before === i.price ? "" : i.price > before ? "flash-up" : "flash-down";
    return `<div class="card idx"><div class="nm">${esc(i.name)}${i.live ? '<span class="liveDot" title="Live"></span>' : ""}</div>
      <div class="px"><span class="${dir}">${i.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span></div>
      ${pctSpan(i.change)}${sparkSVG(i.spark, cssVar(i.change >= 0 ? "--up" : "--down"))}</div>`;
  }).join("") || '<div class="card muted">Index data unavailable right now.</div>';
}
async function refreshIndices() {
  if (document.hidden || !$("#indices")) return;
  try { drawIndices(await api("/api/market")); } catch {}
}

async function renderScreener() {
  let sectors = [];
  try { sectors = (await api("/api/sectors")).map(s => s.sector).sort(); } catch {}
  view.innerHTML = `
    <div class="card">
      <div class="cardHead"><h2>Stock screener</h2><span class="muted small" id="count"></span></div>
      <div class="filters">
        <input id="fText" placeholder="Filter by name or ticker…" value="${esc(screenState.q)}">
        <select id="fSector"><option value="">All sectors</option>${options(sectors.map(s => [s, s]), screenState.sector)}</select>
        <select id="fSize">${options(SIZES, screenState.mincap)}</select>
      </div>
      <div id="table"><div class="skeleton">Loading…</div></div>
      <div class="pager"><button id="prev">← Prev</button><span class="muted small" id="pageInfo"></span><button id="next">Next →</button></div>
    </div>`;
  let t;
  $("#fText").oninput = e => { clearTimeout(t); t = setTimeout(() => { screenState.q = e.target.value; screenState.offset = 0; loadTable(); }, 250); };
  $("#fSector").onchange = e => { screenState.sector = e.target.value; screenState.offset = 0; loadTable(); };
  $("#fSize").onchange = e => { screenState.mincap = e.target.value; screenState.offset = 0; loadTable(); };
  $("#prev").onclick = () => { screenState.offset = Math.max(0, screenState.offset - 50); loadTable(); };
  $("#next").onclick = () => { screenState.offset += 50; loadTable(); };
  loadTable();
}

async function loadTable() {
  store.set("screener", screenState);
  const s = screenState;
  const data = await api(`/api/screener?q=${encodeURIComponent(s.q)}&sector=${encodeURIComponent(s.sector)}&mincap=${s.mincap}&sort=${s.sort}&order=${s.order}&offset=${s.offset}&limit=50`);
  if (!$("#table")) return;
  $("#table").innerHTML = tableHTML(data.rows, s.sort, s.order);
  $("#count").textContent = data.total.toLocaleString() + " stocks";
  $("#pageInfo").textContent = data.total ? `${s.offset + 1}–${Math.min(s.offset + 50, data.total)} of ${data.total.toLocaleString()}` : "";
  $("#prev").disabled = s.offset === 0;
  $("#next").disabled = s.offset + 50 >= data.total;
  $("#table").querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    s.order = s.sort === k ? (s.order === "desc" ? "asc" : "desc") : (["symbol", "sector"].includes(k) ? "asc" : "desc");
    s.sort = k; s.offset = 0; loadTable();
  });
}

const favState = {sort: "1d", order: "desc"};
async function renderFavorites() {
  if (!favs.length) {
    view.innerHTML = `<div class="card empty">No favorites yet.<br>Tap the ☆ next to any stock to add it here.</div>`;
    return;
  }
  view.innerHTML = `<div class="card"><div class="cardHead"><h2>★ Your favorites</h2><span class="muted small">saved on this device</span></div><div id="table"><div class="skeleton">Loading…</div></div></div>`;
  const data = await api(`/api/screener?symbols=${encodeURIComponent(favs.join(","))}&sort=${favState.sort}&order=${favState.order}&limit=200`);
  if (!$("#table")) return;
  $("#table").innerHTML = tableHTML(data.rows, favState.sort, favState.order);
  $("#table").querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    favState.order = favState.sort === k ? (favState.order === "desc" ? "asc" : "desc") : "desc";
    favState.sort = k; renderFavorites();
  });
}

const RANGES = [["1d","1D"],["5d","5D"],["1m","1M"],["6m","6M"],["ytd","YTD"],["1y","1Y"],["5y","5Y"],["max","Max"]];
async function renderStock(sym) {
  view.innerHTML = `<span class="back" onclick="history.length > 1 ? history.back() : location.hash = '#market'">← Back</span><div class="card skeleton">Loading ${esc(sym)}…</div>`;
  let q;
  try { q = await api("/api/quote?symbol=" + encodeURIComponent(sym)); }
  catch { view.innerHTML = `<span class="back" onclick="history.back()">← Back</span><div class="card empty">Couldn't find ${esc(sym)}.</div>`; return; }
  const p = q.profile || {};
  view.innerHTML = `
    <span class="back" onclick="history.length > 1 ? history.back() : location.hash = '#market'">← Back</span>
    <div class="card">
      <div class="stockHead">
        <div><h1>${esc(q.name)} ${starBtn(q.symbol)}</h1>
          <div class="muted">${esc(q.symbol)} · ${esc(q.sector)}${q.industry ? " · " + esc(q.industry) : ""}</div></div>
        <div style="text-align:right"><div class="bigPrice" data-lp="${esc(q.symbol)}" data-focus="${esc(q.symbol)}">${money(q.price)}</div>
          <div class="${cls(q["1d"])}" data-lt="${esc(q.symbol)}">${todayTxt(q.netchange, q["1d"])}</div></div>
      </div>
      <div style="margin-top:14px">${seg(RANGES, "1y", "range")}</div>
      <div class="chartBox"><canvas id="chart"></canvas><div id="chartMsg" class="skeleton"></div></div>
    </div>
    <div class="card"><div class="cardHead"><h2>Performance</h2></div>
      <div class="perf">${PERIODS.map(([k, l]) => `<div><span class="muted small">${l}</span><b class="${cls(q[k])}" ${k === "1d" ? `data-lc="${esc(q.symbol)}" data-base=""` : ""}>${pctTxt(q[k])}</b></div>`).join("")}</div></div>
    <div class="grid g2">
      <div class="card"><div class="cardHead"><h2>Key stats</h2></div><div class="stats" style="grid-template-columns:1fr">
        <div><span class="muted">Market cap</span><span>${q.cap ? "$" + big(q.cap) : "–"}</span></div>
        <div><span class="muted">Volume today</span><span>${big(q.volume)}</span></div>
        <div><span class="muted">52-week high</span><span>${money(q.hi52)}</span></div>
        <div><span class="muted">52-week low</span><span>${money(q.lo52)}</span></div>
        <div><span class="muted">Country</span><span>${esc(q.country || "–")}</span></div>
        <div><span class="muted">IPO year</span><span>${esc(q.ipo || "–")}</span></div>
      </div></div>
      <div class="card about"><div class="cardHead"><h2>About</h2></div>
        ${p.ceo || p.summary ? `<div class="stats" style="grid-template-columns:1fr">
          ${p.ceo ? `<div><span class="muted">${esc(p.ceo_title && p.ceo_title.length < 40 ? p.ceo_title : "CEO")}</span><span>${esc(p.ceo)}</span></div>` : ""}
          ${p.employees ? `<div><span class="muted">Employees</span><span>${p.employees.toLocaleString()}</span></div>` : ""}
          ${p.hq ? `<div><span class="muted">Headquarters</span><span>${esc(p.hq)}</span></div>` : ""}
          ${p.website ? `<div><span class="muted">Website</span><span><a href="${esc(p.website)}" target="_blank" rel="noopener">${esc(p.website.replace(/^https?:\/\/(www\.)?/, ""))}</a></span></div>` : ""}
        </div>${p.summary ? `<p>${esc(p.summary)}${p.summary.length >= 900 ? "…" : ""}</p>` : ""}`
        : `<p>${q.profiles_ok ? "Company profile not loaded yet." : "Company profiles aren't available right now."}</p>`}
      </div>
    </div>`;
  view.querySelectorAll("[data-range]").forEach(b => b.onclick = () => {
    view.querySelectorAll("[data-range]").forEach(x => x.classList.toggle("on", x === b));
    drawChart(sym, b.dataset.range);
  });
  drawChart(sym, "1y");
}

async function drawChart(sym, range) {
  const msg = $("#chartMsg");
  msg.textContent = "Loading chart…";
  if (chart) { chart.destroy(); chart = null; }
  let d;
  try { d = await api(`/api/chart?symbol=${encodeURIComponent(sym)}&range=${range}`); }
  catch { if ($("#chartMsg")) $("#chartMsg").textContent = "Chart data unavailable."; return; }
  if (!$("#chart")) return;
  msg.textContent = "";
  if (typeof Chart === "undefined") { msg.textContent = "Chart library couldn't load (no internet on this device?)."; return; }
  const up = d.closes[d.closes.length - 1] >= d.closes[0];
  const color = cssVar(up ? "--up" : "--down");
  const ctx = $("#chart").getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 0, 320);
  grad.addColorStop(0, color + "40"); grad.addColorStop(1, color + "00");
  chart = new Chart(ctx, {
    type: "line",
    data: { labels: d.labels, datasets: [{ data: d.closes, borderColor: color, backgroundColor: grad, fill: true, borderWidth: 2, pointRadius: 0, tension: 0.15 }] },
    options: {
      maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => money(c.parsed.y) } } },
      scales: {
        x: { ticks: { maxTicksLimit: 6, color: cssVar("--muted") }, grid: { display: false } },
        y: { position: "right", ticks: { color: cssVar("--muted"), callback: v => "$" + v }, grid: { color: cssVar("--line") } },
      },
    },
  });
  chart.liveSym = sym; chart.liveRange = range;   // lets live prices extend the 1D chart
}

// ---------- router ----------
function route() {
  clearInterval(refreshTimer);
  if (chart) { chart.destroy(); chart = null; }
  const h = decodeURIComponent(location.hash.slice(1)) || "market";
  const name = h.startsWith("stock/") ? "stock" : h;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === name));
  window.scrollTo(0, 0);
  if (name === "stock") return renderStock(h.slice(6).toUpperCase());
  if (name === "screener") return renderScreener();
  if (name === "favorites") return renderFavorites();
  renderMarket();
  let ticks = 0;
  refreshTimer = setInterval(() => { if (++ticks % 20 === 0) fillMarket(); else refreshIndices(); }, 3000);
}

// ---------- live prices ----------
let lastPrices = {}, lastChartPush = 0;
function flash(el, dir) { el.classList.remove("flash-up", "flash-down"); void el.offsetWidth; el.classList.add(dir); }
function liveSymbols() {
  const syms = [];
  const add = s => { if (s && !syms.includes(s)) syms.push(s); };
  document.querySelectorAll("[data-focus]").forEach(el => add(el.dataset.focus));   // the stock you're viewing first
  document.querySelectorAll("[data-lp]").forEach(el => add(el.dataset.lp));         // then everything on screen
  favs.forEach(add);                                                                 // then favorites
  return syms.slice(0, 150);
}
function setBadge(d) {
  const b = $("#liveBadge");
  const streaming = Object.values(d.quotes || {}).some(q => q.live);
  if (d.connected) { b.textContent = streaming ? "● LIVE" : "● Live (market quiet)"; b.className = "badge" + (streaming ? " on" : ""); b.title = "Live prices from Finnhub"; }
  else if (d.enabled) { b.textContent = "● Connecting…"; b.className = "badge"; b.title = d.error || ""; }
  else { b.textContent = "● Live off"; b.className = "badge"; b.title = d.error || "Add a Finnhub key for live prices"; }
}
async function pollLive() {
  if (document.hidden) return;
  const syms = liveSymbols();
  let d;
  try { d = await api("/api/live?symbols=" + encodeURIComponent(syms.join(","))); } catch { return; }
  setBadge(d);
  for (const [s, q] of Object.entries(d.quotes)) {
    if (q.p == null) continue;
    const before = lastPrices[s];
    lastPrices[s] = q.p;
    const dir = before == null || before === q.p ? "" : q.p > before ? "flash-up" : "flash-down";
    const sel = CSS.escape(s);
    document.querySelectorAll(`[data-lp="${sel}"]`).forEach(el => { const t = money(q.p); if (el.textContent !== t) { el.textContent = t; if (dir) flash(el, dir); } });
    document.querySelectorAll(`[data-lc="${sel}"]`).forEach(el => { el.textContent = pctTxt(q.c); el.className = (el.dataset.base ? el.dataset.base + " " : "") + cls(q.c); });
    document.querySelectorAll(`[data-lt="${sel}"]`).forEach(el => { el.textContent = todayTxt(q.n, q.c); el.className = cls(q.c); });
    if (chart && chart.liveSym === s && chart.liveRange === "1d" && q.live && dir && Date.now() - lastChartPush > 2000) {
      lastChartPush = Date.now();
      chart.data.labels.push(new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"}));
      chart.data.datasets[0].data.push(q.p);
      chart.update("none");
    }
  }
}
setInterval(pollLive, 1000);
window.addEventListener("hashchange", route);

(async function start() {
  const s = await loadStatus();
  setInterval(loadStatus, 30000);
  if (!s || !s.stocks) {           // wait for the first price download
    const wait = setInterval(async () => { const s2 = await loadStatus(); if (s2 && s2.stocks) { clearInterval(wait); route(); } }, 2000);
  }
  route();
})();
</script>
</body>
